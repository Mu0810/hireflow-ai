name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hireflow
          POSTGRES_PASSWORD: hireflow
          POSTGRES_DB: hireflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Set up environment
        run: |
          echo "NODE_ENV=test" >> .env
          echo "DATABASE_URL=postgresql://hireflow:hireflow@localhost:5432/hireflow_test?schema=public" >> .env
          echo "JWT_ACCESS_SECRET=ci-access-secret-32-chars-long!!" >> .env
          echo "JWT_REFRESH_SECRET=ci-refresh-secret-32-chars-long!" >> .env

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Run migrations
        run: pnpm prisma migrate deploy

      - name: Run API tests
        run: pnpm --filter @hireflow/api test
